[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  SITE_URL = "https://shree-balaji-paints-plywood-hardware.netlify.app"

# Without this the raw .next folder is published as static files and every page returns 404.
[[plugins]]
  package = "@netlify/plugin-nextjs"
